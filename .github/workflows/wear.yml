name: WearOS
on:
  push:
    paths: ['wear/**', '.github/workflows/wear.yml']
  pull_request:
    paths: ['wear/**', '.github/workflows/wear.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The ubuntu runner ships the Android SDK (ANDROID_HOME is set); setup-android@v3 currently fails on a preview-license prompt.
      - uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper JAR is not tracked: binaries nobody can review do not belong in this repo.
          # Gradle itself generates the wrapper here, from the properties file whose checksum pins
          # the distribution it downloads.
          gradle-version: '8.10.2'
      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin
        working-directory: wear
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
        working-directory: wear
