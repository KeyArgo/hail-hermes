name: tests
on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "plugin[test]"
          for proj in simulator tools/facesmith; do
            for f in requirements.txt requirements-dev.txt; do
              if [ -f "$proj/$f" ]; then python -m pip install -r "$proj/$f"; fi
            done
            if [ -f "$proj/pyproject.toml" ]; then python -m pip install -e "$proj"; fi
          done
      - name: Test (plugin, simulator, face generator)
        shell: bash
        run: |
          status=0
          for suite in plugin/tests simulator/tests tools/facesmith/tests; do
            echo "::group::$suite"
            python -m pytest "$suite" -o addopts="" -q -p no:cacheprovider || status=1
            echo "::endgroup::"
          done
          exit $status

  pane:
    # The desktop pane is a React component that only a real render can judge, so it runs here rather
    # than being asserted by grepping its source in the Python suite.
    name: ${{ matrix.os }} / pane render
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Render and click through the pane
        working-directory: tools/pane_jsdom
        run: |
          npm install --no-audit --no-fund
          node run.mjs ../..
