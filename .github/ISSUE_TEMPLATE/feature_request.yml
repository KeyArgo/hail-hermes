name: Feature request
description: Suggest a change or a new use.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the job, not just the implementation.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I read the ROADMAP and this is not already listed with a verdict.
        - label: I understand the watch is optional and the panel is the product.
