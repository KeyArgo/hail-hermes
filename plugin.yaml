name: hail-hermes
label: Hail Hermes
kind: standalone
version: "1.0.0"
manifest_version: 2
api_version: 1
author: Argo
license: MIT
description: >
  Talk to your Hermes agent out loud — in the desktop panel, or from a watch it pairs with in four
  digits. This plugin is the hub: it speaks answers aloud, mirrors the same session on a Wear OS watch
  over your own network, and lets the watch change character, voice, model and session from the wrist.
  The panel needs no hardware. Built to keep working when things go wrong — the watch reconnects by
  itself after the hub restarts or the network drops. Pairing is a code approved on this computer;
  there is no automatic approval path. Works on your local network only.
python_dependencies:
  - "websockets>=13,<16"
provides_tools:
  - device_notify
  - device_say
  - device_haptic
  - device_battery
provides_hooks: []
